version: "3.8"

services:
  db:
    image: postgres:14
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    networks:
      - mynet
    deploy:
      placement:
        constraints: [node.role == worker]  # run on workers
      replicas: 1

  web:
    image: your_dockerhub_username/django_web:latest
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: postgres
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgrespassword
    networks:
      - mynet
    ports:
      - target: 8000
        published: 80
        protocol: tcp
        mode: host
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s

networks:
  mynet:
    driver: overlay

volumes:
  pgdata:
