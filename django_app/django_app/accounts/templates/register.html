<!doctype html>
<html>
  <body>
    <h2>Register</h2>
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
    <form method="post">{% csrf_token %}
      <label>Roll No: <input name="username" /></label><br/>
      <label>Admission No: <input type="password" name="password" /></label><br/>
      <button type="submit">Register</button>
    </form>
    <p><a href="/">Back to Login</a></p>
  </body>
</html>
