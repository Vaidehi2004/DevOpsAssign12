- hosts: manager
  become: yes
  tasks:
    - name: Initialize Docker Swarm
      shell: |
        docker swarm init --advertise-addr {{ ansible_host }}
      register: swarm_init
      failed_when: swarm_init.rc not in [0,1]  # rc=1 may indicate already initialized

    - name: Get worker join token
      shell: docker swarm join-token worker -q
      register: worker_join_token

    - name: Set fact for join token
      set_fact:
        join_token: "{{ worker_join_token.stdout }}"

    - name: debug token
      debug: var=join_token

- hosts: workers
  become: yes
  vars:
    manager_ip: "{{ hostvars[groups['manager'][0]]['ansible_host'] }}"
  tasks:
    - name: Worker join to swarm
      shell: |
        docker swarm join --token {{ hostvars[groups['manager'][0]]['join_token'] }} {{ manager_ip }}:2377
      register: join_out
      failed_when: join_out.rc not in [0,1]

- hosts: manager
  become: yes
  tasks:
    - name: Copy docker stack file
      copy:
        src: ../../docker/docker-compose.yml
        dest: /home/{{ ansible_user | default('ubuntu') }}/docker-compose.yml
        mode: '0644'

    - name: Deploy stack (myapp)
      shell: |
        docker stack deploy -c /home/{{ ansible_user | default('ubuntu') }}/docker-compose.yml myapp
      args:
        chdir: /home/{{ ansible_user | default('ubuntu') }}
