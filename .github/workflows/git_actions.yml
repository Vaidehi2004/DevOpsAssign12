name: CI-CD

on:
  push:
    branches:
      - 'ITA776'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install deps & run tests
        run: |
          pip install -r django_app/requirements.txt
          python -m pip install selenium

      - name: Build and push docker image
        run: |
          echo "Build & push step - implement if you have Docker Hub/GHCR credentials set as secrets"
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/ITA700' || startsWith(github.ref, 'refs/heads/ITA')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to controller via SSH and run bootstrap (example)
        uses: appleboy/scp-action@v0.1.8
        with:
          host: ${{ secrets.CONTROLLER_IP }}
          username: ubuntu
          key: ${{ secrets.CONTROLLER_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/devops_assignment"

      - name: Run bootstrap on controller
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.CONTROLLER_IP }}
          username: ubuntu
          key: ${{ secrets.CONTROLLER_SSH_KEY }}
          script: |
            cd /home/ubuntu/devops_assignment/scripts
            chmod +x bootstrap.sh
            ./bootstrap.sh
